name: samvaad-local-test
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: samvaad_local
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:?required}
      POSTGRES_DB: samvaad_local
    ports: ["127.0.0.1:15432:5432"]
    volumes: ["pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U samvaad_local"]
      interval: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "always", "--maxmemory-policy", "noeviction"]
    ports: ["127.0.0.1:16379:6379"]
    volumes: ["redis:/data"]
  rabbitmq:
    image: rabbitmq:4-alpine
    environment:
      RABBITMQ_DEFAULT_USER: samvaad_local
      RABBITMQ_DEFAULT_PASS: ${LOCAL_BROKER_PASSWORD:?required}
    ports: ["127.0.0.1:15672:5672"]
    volumes: ["rabbit:/var/lib/rabbitmq"]
  storage:
    image: rustfs/rustfs:latest
    command: ["/data"]
    environment:
      RUSTFS_ACCESS_KEY: samvaad-local
      RUSTFS_SECRET_KEY: ${LOCAL_STORAGE_PASSWORD:?required}
      RUSTFS_SSE_S3_MASTER_KEY: ${LOCAL_STORAGE_MASTER_KEY:?required}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "false"
    ports: ["127.0.0.1:19000:9000"]
    volumes: ["storage:/data"]
  mail:
    image: axllent/mailpit:v1.27.4
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
      MP_DATABASE: /data/mailpit.db
    ports: ["127.0.0.1:11025:1025", "127.0.0.1:18025:8025"]
    volumes: ["mail:/data"]
volumes:
  pg:
  redis:
  rabbit:
  storage:
  mail:

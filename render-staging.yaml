services:
  - type: web
    name: samvaad-sathi-backend-staging
    env: python
    region: oregon
    plan: free
    branch: staging
    rootDir: backend/backend
    buildCommand: pip install -r requirements.txt
    preDeployCommand: alembic upgrade head
    startCommand: uvicorn src.main:backend_app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: STAGE
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: BACKEND_SERVER_HOST
        sync: false
      - key: BACKEND_SERVER_PORT
        sync: false
      - key: BACKEND_SERVER_WORKERS
        sync: false
      - key: POSTGRES_HOST
        sync: false
      - key: POSTGRES_DB
        sync: false
      - key: POSTGRES_PASSWORD
        sync: false
      - key: POSTGRES_USER
        sync: false
      - key: POSTGRES_USERNAME
        sync: false
      - key: DB_MAX_POOL_CON
        sync: false
      - key: DB_POOL_SIZE
        sync: false
      - key: DB_POOL_OVERFLOW
        sync: false
      - key: POSTGRES_PORT
        sync: false
      - key: POSTGRES_SCHEMA
        sync: false
      - key: DB_TIMEOUT
        sync: false
      - key: IS_DB_ECHO_LOG
        sync: false
      - key: IS_DB_FORCE_ROLLBACK
        sync: false
      - key: IS_DB_EXPIRE_ON_COMMIT
        sync: false
      - key: API_TOKEN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: AUTH_SERVICE_BASE_URL
        sync: false
      - key: SSO_REDIRECT_URI
        sync: false
      - key: CENTRAL_IDENTITY_CHECK_ENABLED
        value: 'True'
      - key: PRODUCT_IDENTITY_API_KEY
        sync: false
      - key: CENTRAL_PROFILE_API_KEY
        sync: false
      - key: SAMPARK_ENROLLMENT_SYNC_ENABLED
        value: 'True'
      - key: SAMPARK_ENROLLMENT_SYNC_URL
        sync: false
      - key: SAMPARK_ENROLLMENT_SYNC_KEY
        sync: false
      - key: EXPOSE_ERROR_DETAIL
        value: 'False'
      - key: EXPOSE_API_DOCS
        value: 'True'
      - key: REDIS_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ASSEMBLYAI_API_KEY
        sync: false
      - key: JWT_MIN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: AUTH_SERVICE_JWT_SECRET
        sync: false
      - key: AUTH_TOKEN
        sync: false
      - key: HASHING_ALGORITHM_LAYER_1
        sync: false
      - key: HASHING_ALGORITHM_LAYER_2
        sync: false
      - key: HASHING_SALT
        sync: false
      - key: IS_ALLOWED_CREDENTIALS
        sync: false
      - key: JWT_ALGORITHM
        sync: false
      - key: JWT_DAY
        sync: false
      - key: JWT_HOUR
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: JWT_SUBJECT
        sync: false
      - key: JWT_TOKEN_PREFIX
        sync: false
      - key: SESSION_SECRET_KEY
        sync: false

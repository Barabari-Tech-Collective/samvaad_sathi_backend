services:
  - type: web
    name: samvaad-sathi-backend-staging
    env: python
    region: oregon
    plan: free
    branch: staging
    rootDir: backend/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.main:backend_app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: STAGING
      - key: PYTHON_VERSION
        value: 3.13.0

name: Production release
on:
  workflow_dispatch:
    inputs:
      test_evidence:
        description: 'Production acceptance record (tester, date, local/CI results, and approval link)'
        type: string
        required: true
      database_backup_reference:
        description: 'Verified pre-migration backup reference: Aiven backup ID + timestamp, or pg_dump archive path + SHA-256 + timestamp (archive must pass pg_restore --list)'
        type: string
        required: true
permissions:
  contents: read
  deployments: write
  id-token: write
concurrency:
  group: release-production
  cancel-in-progress: false
jobs:
  quality:
    uses: ./.github/workflows/ci.yml
  deploy:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Authenticate to AWS with short-lived credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Deploy tested commit and verify health
        run: python ops/release.py
        env:
          TEST_EVIDENCE: ${{ inputs.test_evidence }}
          DATABASE_BACKUP_REFERENCE: ${{ inputs.database_backup_reference }}
          GH_TOKEN: ${{ github.token }}
          HEALTH_URL: ${{ vars.HEALTH_URL }}
          PRODUCTION_PROVIDER: ec2
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          EC2_RELEASE_CONFIGURED: ${{ vars.EC2_RELEASE_CONFIGURED }}

name: CI
on:
  pull_request:
  push:
    branches: [Manager-Arma-new-samvaad-10, staging, main]
  workflow_call:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/backend/requirements.txt
      - run: pip install -r backend/backend/requirements.txt
      - name: Compile application
        run: python -m compileall -q backend/backend/src
      - name: Run complete test suite with synthetic settings
        run: python ops/ci_tests.py -q --junitxml=test-results/backend.xml
      - name: Check release runner syntax
        run: bash -n ops/ec2-release.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: test-results/
